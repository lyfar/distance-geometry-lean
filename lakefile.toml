name = "distance-geometry-lean"
version = "0.1.0"
keywords = ["mathematics", "distance-geometry", "lean"]
defaultTargets = ["DistanceGeometry"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0-rc1"

[[lean_lib]]
name = "DistanceGeometry"
